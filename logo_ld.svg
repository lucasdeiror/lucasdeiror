<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161224" />
      <stop offset="100%" stop-color="#0D0B14" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2B2245" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="ldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8B5CF6" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Monograma LD Estilizado -->
  <g filter="url(#glow)">
    <!-- Letra L: Haste vertical e base horizontal integrada -->
    <path d="M 18 18 
             L 24 18 
             L 24 40 
             L 34 40 
             L 34 46 
             L 18 46 
             Z" 
          fill="url(#ldGrad)" />
    
    <!-- Letra D: Haste vertical alinhada e arco curvo moderno com vazamento interno proporcional -->
    <path d="M 33 18 
             L 42 18 
             C 49 18 53 23 53 32 
             C 53 41 49 46 42 46 
             L 33 46 
             L 33 40 
             L 41 40 
             C 45 40 47 37 47 32 
             C 47 27 45 24 41 24 
             L 33 24 
             Z" 
          fill="url(#ldGrad)" />
          
    <!-- Ponto de Acento Tecnológico / Glow Nó -->
    <circle cx="21" cy="18" r="2" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>